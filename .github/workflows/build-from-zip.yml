name: Build Samalut APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          mkdir -p extracted
          unzip -q samalut-apk-build.zip -d extracted
          cp -a extracted/samalut-apk-build/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          [ -f .env.example ] && cp .env.example .env || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samalut-Education-APK
          path: app/build/outputs/apk/debug/*.apk
          
